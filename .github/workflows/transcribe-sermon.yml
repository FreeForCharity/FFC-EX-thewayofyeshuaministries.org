name: Transcribe Sermon

# Turns a sermon recording into a draft transcript a person can edit.
#
# Runs here rather than on a laptop because the speech model is a few hundred
# megabytes and the work is CPU-bound: drop the audio in, come back to a
# transcript. Nothing it produces is published -- see the banner the script
# writes at the top of every file.

on:
  # Drop an audio file in sermons/audio/ and push: the transcript follows.
  push:
    paths:
      - 'sermons/audio/**'
      # A fix to the pipeline should retry the recordings it failed on, rather
      # than sitting idle until the next recording happens to arrive. Safe to
      # re-run: this path transcribes only recordings that have no transcript
      # yet, and the script refuses to overwrite one in any case.
      - '.github/workflows/transcribe-sermon.yml'
      - '.github/scripts/transcribe-sermon.py'
  # Or run it by hand against one file from the Actions tab.
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to one audio file (default: every untranscribed file)'
        type: string
        default: ''
      overwrite:
        # Naming a file by hand is the one path that can reach a recording
        # already transcribed, and a transcript that has been read and
        # corrected is worth far more than the recording it came from -- that
        # editing is most of the work and cannot be redone by the machine. So
        # replacing one has to be asked for on purpose.
        description: 'Replace an existing transcript, discarding any hand corrections in it'
        type: boolean
        default: false

# Nothing is granted here. The two jobs below want very different things, and
# only the short one that writes a commit needs to be able to write.
permissions: {}

# One transcription at a time per branch.
#
# Rebasing before the push is not enough on its own: two runs can both rebase
# and then race, and the one that loses takes its transcript down with its
# runner after fifteen minutes of work.
#
# `cancel-in-progress: false` keeps one run waiting rather than cancelling the
# one working, but GitHub holds only a single pending run per group: a third
# request evicts the one waiting. For a push that comes out right anyway --
# the next run reads the branch tip and transcribes whatever still has no
# transcript, which includes anything an evicted run would have done. For a
# manual run naming one file it does not: dispatch it again. Giving each
# recording its own group would let runs push over each other instead, which
# is the failure this group exists to prevent.
concurrency:
  group: transcribe-sermon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The long job, and the one that runs code this repository did not write:
  # a few hundred megabytes of speech model, pulled from PyPI and from the
  # model host. It gets no write access and no credentials on disk, so a bad
  # release of any of that can spoil a transcript -- which a person reads
  # anyway -- but cannot reach the repository.
  transcribe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Speech recognition is slow: roughly a third of real time on a runner, so
    # a 45-minute sermon takes about 15 minutes.
    timeout-minutes: 60
    outputs:
      # Whether this run actually wrote a transcript. Most runs do not: a fix
      # to the workflow itself starts one, and every recording already has its
      # transcript.
      produced: ${{ steps.transcribe.outputs.produced }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # actions/checkout leaves the job's token in .git/config by default,
          # where everything that runs afterwards can read it. Nothing in this
          # job pushes, so it does not need one.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install faster-whisper
        # Pinned so a transcript can always be reproduced from the same words.
        #
        # `requests` is installed alongside it deliberately: faster-whisper
        # imports it without declaring it as a dependency, which failed this
        # workflow on a clean runner even though it worked where `requests`
        # happened to be present already. 1.1.1 imported it at module load;
        # 1.2.1 does not, but it is still reachable from the model download, so
        # the guard stays.
        run: pip install --quiet faster-whisper==1.2.1 requests

      - name: Transcribe
        id: transcribe
        env:
          WHISPER_MODEL: small.en
          # Passed as an environment variable, never written into the script.
          #
          # A GitHub Actions expression is substituted into the shell source
          # before the shell parses it, so a value containing $(...) or
          # backticks would execute as commands on this runner. This input is
          # free text from whoever runs the workflow, so it is exactly the
          # value not to interpolate.
          REQUESTED_FILE: ${{ inputs.file }}
          # Empty on a push, so the script's refusal to overwrite stands
          # unless someone dispatches the workflow and ticks the box.
          ALLOW_OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail

          # Work from the branch tip, not from the commit that triggered this
          # run.
          #
          # Runs are serialized, so a run queued behind a fifteen-minute one
          # starts from a checkout taken before that run committed its
          # transcript. It would then transcribe the same recording again and
          # collide with it on the way back in. No credentials needed: the
          # repository is public, and this job deliberately holds none.
          git fetch --quiet origin "$GITHUB_REF_NAME"
          git reset --quiet --hard FETCH_HEAD

          # An array, not a string: "Sermon on the Mount.mp3" is a perfectly
          # ordinary name for a recording, and a space in it would otherwise
          # split into several paths that do not exist.
          targets=()
          if [ -n "$REQUESTED_FILE" ]; then
            targets=("$REQUESTED_FILE")
          else
            # Every recording that has no transcript yet. The formats listed
            # here are the ones the script accepts; keep the two in step.
            shopt -s nullglob
            declare -A claimed_by=()
            for audio in sermons/audio/*.{mp3,m4a,wav,mp4,aac,ogg,flac}; do
              stem="$(basename "${audio%.*}")"
              if [ -f "sermons/transcripts/${stem}.md" ]; then
                continue
              fi
              # The transcript is named after the recording, so the same
              # sermon kept in two formats -- sermon.mp3 and sermon.wav --
              # wants the same file. Take the first and say which was left,
              # rather than letting the second fail against the transcript the
              # first just wrote.
              if [ -n "${claimed_by[$stem]:-}" ]; then
                echo "::warning::Skipping $audio: ${claimed_by[$stem]} already becomes sermons/transcripts/${stem}.md"
                continue
              fi
              claimed_by[$stem]="$audio"
              targets+=("$audio")
            done
          fi

          if [ ${#targets[@]} -eq 0 ]; then
            echo "Nothing to transcribe — every recording already has a transcript."
            exit 0
          fi

          # Each recording stands on its own. Stopping the loop at the first
          # failure would throw away the transcripts already made in this run
          # -- they are committed by a later job -- and the next run would
          # start from the same list and fail in the same place, so one
          # unreadable file would block every other recording indefinitely.
          produced=false
          failed=()
          staging="$RUNNER_TEMP/new-transcripts"
          mkdir -p "$staging"
          for audio in "${targets[@]}"; do
            stem="$(basename "${audio%.*}")"
            echo "::group::$audio"
            if python3 .github/scripts/transcribe-sermon.py "$audio"; then
              # Only what this run wrote goes on to be committed. Handing over
              # the whole directory would carry a copy of every other
              # transcript as it looked when this job started, and a
              # correction someone made during the fifteen minutes since would
              # be committed straight back to its old state.
              cp "sermons/transcripts/${stem}.md" "$staging/"
              produced=true
            else
              failed+=("$audio")
            fi
            echo "::endgroup::"
          done

          if [ "$produced" = true ]; then
            echo "produced=true" >> "$GITHUB_OUTPUT"
          fi

          # Reported after the loop, so the whole run is red and visible while
          # the transcripts that did work still reach the branch.
          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::Could not transcribe: ${failed[*]}"
            exit 1
          fi

      - name: Hand the transcripts to the job that can commit
        # Runs even when a later recording failed: see the loop above.
        if: ${{ !cancelled() && steps.transcribe.outputs.produced == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: transcripts
          path: ${{ runner.temp }}/new-transcripts

  # The short job, and the only one holding a token that can write. It runs
  # git and nothing else: no repository scripts, no third-party packages.
  commit:
    needs: transcribe
    # Skipped entirely when the run transcribed nothing, which is the common
    # case: there is then no artifact to fetch and nothing to write. Not
    # skipped merely because one recording of several failed -- the ones that
    # worked are worth keeping, and the run stays red either way.
    if: ${{ !cancelled() && needs.transcribe.outputs.produced == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move to the branch tip
        # For the same reason the transcribe job does it: this checkout is the
        # commit that triggered the run, and the branch may have moved on
        # during the many minutes of transcription. Done before the artifact
        # is unpacked, so the transcripts land on top of whatever is current
        # rather than being reset away with it.
        run: |
          set -euo pipefail
          git fetch --quiet origin "$GITHUB_REF_NAME"
          git reset --quiet --hard FETCH_HEAD

      - name: Collect the transcripts
        uses: actions/download-artifact@v4
        with:
          name: transcripts
          path: ${{ runner.temp }}/new-transcripts

      - name: Put them with the others
        # Copied in one by one rather than unpacked over the directory, so
        # this run adds what it made and touches nothing else.
        run: |
          set -euo pipefail
          mkdir -p sermons/transcripts
          cp "$RUNNER_TEMP"/new-transcripts/*.md sermons/transcripts/

      - name: Commit the transcripts
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sermons/transcripts
          if git diff --staged --quiet; then
            echo "No new transcripts."
            exit 0
          fi

          git commit -m "chore: draft transcripts for new sermon recordings"

          # Transcribing takes many minutes, and anything pushed to the branch
          # meanwhile leaves this job behind: the push is rejected and the
          # transcript dies with the runner, after all the work of making it.
          # Rebasing first narrows that to the seconds between the rebase and
          # the push -- still a window, and not one that heals: a push that
          # touches none of this workflow's trigger paths starts no new run, so
          # nothing would come back for the transcript. So rebase, push, and if
          # someone got in first, do it again.
          #
          # The branch is read from the runner's own environment rather than
          # interpolated: a branch name is attacker-chosen text, and an Actions
          # expression lands in the script before the shell parses it.
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              echo "✓ Draft transcripts committed. They need a read before anything is published."
              exit 0
            fi
            echo "::warning::Push rejected on attempt ${attempt}: something landed on ${GITHUB_REF_NAME} first. Rebasing and trying again."
          done

          echo "::error::Could not push the transcripts after 3 attempts. They are kept in this run's 'transcripts' artifact."
          exit 1

name: Transcribe Sermon

# Turns a sermon recording into a draft transcript a person can edit.
#
# Runs here rather than on a laptop because the speech model is a few hundred
# megabytes and the work is CPU-bound: drop the audio in, come back to a
# transcript. Nothing it produces is published -- see the banner the script
# writes at the top of every file.

on:
  # Drop an audio file in sermons/audio/ and push: the transcript follows.
  push:
    paths:
      - 'sermons/audio/**'
      # A fix to the pipeline should retry the recordings it failed on, rather
      # than sitting idle until the next recording happens to arrive. Safe to
      # re-run: this path transcribes only recordings that have no transcript
      # yet, and the script refuses to overwrite one in any case.
      - '.github/workflows/transcribe-sermon.yml'
      - '.github/scripts/transcribe-sermon.py'
  # Or run it by hand against one file from the Actions tab.
  workflow_dispatch:
    inputs:
      file:
        description: 'Path to one audio file (default: every untranscribed file)'
        type: string
        default: ''
      overwrite:
        # Naming a file by hand is the one path that can reach a recording
        # already transcribed, and a transcript that has been read and
        # corrected is worth far more than the recording it came from -- that
        # editing is most of the work and cannot be redone by the machine. So
        # replacing one has to be asked for on purpose.
        description: 'Replace an existing transcript, discarding any hand corrections in it'
        type: boolean
        default: false

# Nothing is granted here. The two jobs below want very different things, and
# only the short one that writes a commit needs to be able to write.
permissions: {}

# One transcription at a time per branch.
#
# Rebasing before the push is not enough on its own: two runs can both rebase
# and then race, and the one that loses takes its transcript down with its
# runner after fifteen minutes of work. Queued rather than cancelled, because
# the second run usually has a different recording to get through.
concurrency:
  group: transcribe-sermon-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The long job, and the one that runs code this repository did not write:
  # a few hundred megabytes of speech model, pulled from PyPI and from the
  # model host. It gets no write access and no credentials on disk, so a bad
  # release of any of that can spoil a transcript -- which a person reads
  # anyway -- but cannot reach the repository.
  transcribe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Speech recognition is slow: roughly a third of real time on a runner, so
    # a 45-minute sermon takes about 15 minutes.
    timeout-minutes: 60
    outputs:
      # Whether this run actually wrote a transcript. Most runs do not: a fix
      # to the workflow itself starts one, and every recording already has its
      # transcript.
      produced: ${{ steps.transcribe.outputs.produced }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # actions/checkout leaves the job's token in .git/config by default,
          # where everything that runs afterwards can read it. Nothing in this
          # job pushes, so it does not need one.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install faster-whisper
        # Pinned so a transcript can always be reproduced from the same words.
        #
        # `requests` is installed alongside it deliberately: faster-whisper
        # imports it without declaring it as a dependency, which failed this
        # workflow on a clean runner even though it worked where `requests`
        # happened to be present already. 1.1.1 imported it at module load;
        # 1.2.1 does not, but it is still reachable from the model download, so
        # the guard stays.
        run: pip install --quiet faster-whisper==1.2.1 requests

      - name: Transcribe
        id: transcribe
        env:
          WHISPER_MODEL: small.en
          # Passed as an environment variable, never written into the script.
          #
          # A GitHub Actions expression is substituted into the shell source
          # before the shell parses it, so a value containing $(...) or
          # backticks would execute as commands on this runner. This input is
          # free text from whoever runs the workflow, so it is exactly the
          # value not to interpolate.
          REQUESTED_FILE: ${{ inputs.file }}
          # Empty on a push, so the script's refusal to overwrite stands
          # unless someone dispatches the workflow and ticks the box.
          ALLOW_OVERWRITE: ${{ inputs.overwrite }}
        run: |
          set -euo pipefail

          # An array, not a string: "Sermon on the Mount.mp3" is a perfectly
          # ordinary name for a recording, and a space in it would otherwise
          # split into several paths that do not exist.
          targets=()
          if [ -n "$REQUESTED_FILE" ]; then
            targets=("$REQUESTED_FILE")
          else
            # Every recording that has no transcript yet.
            shopt -s nullglob
            for audio in sermons/audio/*.{mp3,m4a,wav,mp4,aac,ogg,flac}; do
              stem="$(basename "${audio%.*}")"
              [ -f "sermons/transcripts/${stem}.md" ] || targets+=("$audio")
            done
          fi

          if [ ${#targets[@]} -eq 0 ]; then
            echo "Nothing to transcribe — every recording already has a transcript."
            exit 0
          fi

          for audio in "${targets[@]}"; do
            echo "::group::$audio"
            python3 .github/scripts/transcribe-sermon.py "$audio"
            echo "::endgroup::"
          done

          echo "produced=true" >> "$GITHUB_OUTPUT"

      - name: Hand the transcripts to the job that can commit
        if: steps.transcribe.outputs.produced == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: transcripts
          path: sermons/transcripts

  # The short job, and the only one holding a token that can write. It runs
  # git and nothing else: no repository scripts, no third-party packages.
  commit:
    needs: transcribe
    # Skipped entirely when the run transcribed nothing, which is the common
    # case: there is then no artifact to fetch and nothing to write.
    if: needs.transcribe.outputs.produced == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Collect the transcripts
        uses: actions/download-artifact@v4
        with:
          name: transcripts
          path: sermons/transcripts

      - name: Commit the transcripts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sermons/transcripts
          if git diff --staged --quiet; then
            echo "No new transcripts."
          else
            git commit -m "chore: draft transcripts for new sermon recordings"
            # Transcribing takes many minutes, and anything pushed to the
            # branch meanwhile leaves this job behind: the push is then
            # rejected and the transcript dies with the runner, after all the
            # work of producing it. Rebase onto whatever landed instead.
            git pull --rebase origin "$GITHUB_REF_NAME"
            # Named explicitly so this works on a branch as well as on main,
            # and read from the runner's own environment rather than
            # interpolated: a branch name is attacker-chosen text, and an
            # Actions expression lands in the script before the shell parses
            # it.
            git push origin "HEAD:$GITHUB_REF_NAME"
            echo "✓ Draft transcripts committed. They need a read before anything is published."
          fi
